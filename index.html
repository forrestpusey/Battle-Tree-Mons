<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Tree Pro + Backup</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; padding: 15px; color: #333; }
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h2 { margin-top: 0; color: #2c3e50; font-size: 1.1rem; border-bottom: 2px solid #eee; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        input { width: 100%; padding: 12px; margin: 5px 0 15px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        button { background: #3498db; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .save-btn { background: #27ae60; width: 100%; padding: 15px; margin-top: 10px; }
        .backup-btn { background: #9b59b6; font-size: 0.8rem; margin: 5px; flex: 1; }
        .backup-container { display: flex; justify-content: space-between; margin-top: 10px; }
        .sort-btn { background: #f1f3f5; color: #666; font-size: 0.7rem; padding: 5px 10px; margin-left: 5px; }
        .sort-btn.active { background: #3498db; color: white; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-box { background: #f8f9fa; padding: 10px; border-radius: 8px; border: 1px solid #eee; }
        .badge { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; display: inline-block; margin-top: 5px; }
        .badge-30 { background: #cd7f32; color: white; }
        .badge-40 { background: #bdc3c7; color: white; }
        .badge-50 { background: #f1c40f; color: black; }
        .badge-100 { background: #9b59b6; color: white; }
        .record-item { border-bottom: 1px solid #eee; padding: 10px 0; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="card">
        <h2>New Run</h2>
        <input type="text" id="p1" list="poke-list" placeholder="Pokémon 1">
        <input type="text" id="p2" list="poke-list" placeholder="Pokémon 2">
        <input type="text" id="p3" list="poke-list" placeholder="Pokémon 3">
        <input type="text" id="p4" list="poke-list" placeholder="Pokémon 4 (Optional)">
        <input type="number" id="wins" placeholder="Win Streak Count">
        <button class="save-btn" onclick="saveRun()">Save Record</button>
        <datalist id="poke-list"></datalist>
    </div>

    <div class="card">
        <h2>Backup & Restore</h2>
        <p style="font-size: 0.7rem; color: #666;">Export your data to a text file or Notes app to keep it safe.</p>
        <div class="backup-container">
            <button class="backup-btn" onclick="exportData()">Copy Backup to Clipboard</button>
            <button class="backup-btn" style="background:#34495e" onclick="importData()">Import from Clipboard</button>
        </div>
    </div>

    <div class="card">
        <h2>Leaderboard
            <div>
                <button class="sort-btn active" id="sortWins" onclick="setSort('wins')">Wins</button>
                <button class="sort-btn" id="sortRuns" onclick="setSort('runs')">Usage</button>
            </div>
        </h2>
        <div id="statsList" class="stats-grid"></div>
    </div>

    <div class="card">
        <h2>History</h2>
        <div id="historyList"></div>
        <button onclick="clearData()" style="background:none; color:#95a5a6; font-size: 0.7rem; width:100%; margin-top: 20px;">Wipe All Data</button>
    </div>

    <script>
        let currentSort = 'wins';
        window.onload = updateDisplay;

        function setSort(type) {
            currentSort = type;
            document.getElementById('sortWins').classList.toggle('active', type === 'wins');
            document.getElementById('sortRuns').classList.toggle('active', type === 'runs');
            updateDisplay();
        }

        function saveRun() {
            const inputs = ['p1', 'p2', 'p3', 'p4'];
            const team = inputs.map(id => document.getElementById(id).value.trim()).filter(val => val !== "");
            const wins = parseInt(document.getElementById('wins').value);
            if(team.length < 1 || isNaN(wins)) return alert("Fill in the team and wins!");
            const run = { team, wins, date: new Date().toLocaleDateString() };
            let history = JSON.parse(localStorage.getItem('bt_records')) || [];
            history.push(run);
            localStorage.setItem('bt_records', JSON.stringify(history));
            inputs.forEach(id => document.getElementById(id).value = '');
            document.getElementById('wins').value = '';
            updateDisplay();
        }

        function exportData() {
            const data = localStorage.getItem('bt_records');
            if (!data || data === "[]") return alert("No data to export!");
            navigator.clipboard.writeText(data).then(() => {
                alert("Backup code copied to clipboard! Paste it in your Notes app.");
            });
        }

        function importData() {
            const code = prompt("Paste your backup code here:");
            if (!code) return;
            try {
                JSON.parse(code); // Validate it's real data
                localStorage.setItem('bt_records', code);
                updateDisplay();
                alert("Data restored successfully!");
            } catch (e) {
                alert("Invalid backup code.");
            }
        }

        function getBadge(maxWin) {
            if (maxWin >= 100) return '<span class="badge badge-100">DIAMOND</span>';
            if (maxWin >= 50) return '<span class="badge badge-50">GOLD</span>';
            if (maxWin >= 40) return '<span class="badge badge-40">SILVER</span>';
            if (maxWin >= 30) return '<span class="badge badge-30">BRONZE</span>';
            return '';
        }

        function updateDisplay() {
            const history = JSON.parse(localStorage.getItem('bt_records')) || [];
            const stats = {};
            const uniqueNames = new Set();
            history.forEach(run => {
                run.team.forEach(name => {
                    uniqueNames.add(name);
                    if(!stats[name]) stats[name] = { totalWins: 0, runs: 0, maxWin: 0 };
                    stats[name].totalWins += run.wins;
                    stats[name].runs += 1;
                    if(run.wins > stats[name].maxWin) stats[name].maxWin = run.wins;
                });
            });
            document.getElementById('poke-list').innerHTML = Array.from(uniqueNames).map(n => `<option value="${n}">`).join('');
            const sortedKeys = Object.keys(stats).sort((a, b) => {
                if(currentSort === 'wins') return stats[b].totalWins - stats[a].totalWins;
                return stats[b].runs - stats[a].runs;
            });
            document.getElementById('statsList').innerHTML = sortedKeys.map(name => `
                <div class="stat-box">
                    <div style="font-weight: bold; font-size: 0.85rem;">${name}</div>
                    <div style="font-size: 0.7rem; color: #666;">Wins: ${stats[name].totalWins} | Runs: ${stats[name].runs}</div>
                    ${getBadge(stats[name].maxWin)}
                </div>
            `).join('');
            document.getElementById('historyList').innerHTML = history.slice().reverse().map(run => `
                <div class="record-item"><strong>${run.wins} Wins</strong><br><small>${run.team.join(' / ')}</small></div>
            `).join('');
        }

        function clearData() { if(confirm("Wipe all stats?")) { localStorage.clear(); updateDisplay(); } }
    </script>
</body>
</html>
