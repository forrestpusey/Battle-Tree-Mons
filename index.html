<!-- UPDATE: Add this datalist element right before your "Record Run" card -->
<datalist id="pkmn-list"></datalist>

<div class="card">
    <h2 id="form-title">Record Run</h2>
    <div class="input-grid">
        <!-- UPDATE: Added list="pkmn-list" to all species inputs -->
        <input type="text" id="p1" placeholder="Lead (Species)" list="pkmn-list">
        <input type="text" id="p2" placeholder="Sub (Species)" list="pkmn-list">
        <input type="text" id="p3" placeholder="Sub (Species)" list="pkmn-list">
        <input type="text" id="p4" placeholder="Opt (Species)" list="pkmn-list">
    </div>
    <input type="number" id="wins" placeholder="Streak Wins" style="margin-top:8px;">
    <div id="btn-container">
        <button class="btn-main" onclick="saveRun()">Register Entry</button>
    </div>
</div>

<script>
    // UPDATE: Add this function to your script block to populate the suggestions
    function updateDatalist(stats) {
        const list = document.getElementById('pkmn-list');
        const names = Object.keys(stats).sort();
        list.innerHTML = names.map(name => `<option value="${name}">`).join('');
    }

    // UPDATE: Inside your existing updateDisplay() function, 
    // call updateDatalist(stats) right after the stats object is fully built:
    function updateDisplay() {
        const data = JSON.parse(localStorage.getItem(DB_KEY) || '[]');
        const stats = {};

        data.forEach(run => {
            run.team.forEach((name) => {
                if(!stats[name]) stats[name] = { wins: 0, runs: 0, max: 0, partners: new Set() };
                stats[name].wins += run.wins;
                stats[name].runs += 1;
                if(run.wins > stats[name].max) stats[name].max = run.wins;
                run.team.forEach(p => { if(p !== name) stats[name].partners.add(p); });
            });
        });

        // NEW CALL HERE:
        updateDatalist(stats); 

        // ... rest of your existing updateDisplay code remains exactly the same ...
    }
</script>
